name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., 0.41.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (e.g., 0.42.0-SNAPSHOT)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (skip actual deployment and tagging)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.DEBEZIUM_GH_TOKEN }}
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE
    
    - name: Configure Git
      run: |
        git config user.name "Debezium Builder"
        git config user.email "debezium@gmail.com"
    
    - name: Validate version format
      run: |
        if [[ ! "${{ inputs.release_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: Release version must be in format X.Y.Z"
          exit 1
        fi
        if [[ ! "${{ inputs.next_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
          echo "Error: Next version must be in format X.Y.Z-SNAPSHOT"
          exit 1
        fi
    
    - name: Set release version
      run: |
        ./mvnw versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false
        git add pom.xml
        git commit -m "Release version ${{ inputs.release_version }}"
    
    - name: Build and verify
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        ./mvnw clean verify -Dgpg.skip=false
    
    - name: Deploy to Maven Central
      if: ${{ !inputs.dry_run }}
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        ./mvnw deploy -DskipTests -Dgpg.skip=false -Dpublish.skip=false -Dpublish.auto=true
    
    - name: Create and push Git tag
      if: ${{ !inputs.dry_run }}
      run: |
        git tag -a v${{ inputs.release_version }} -m "Release version ${{ inputs.release_version }}"
        git push origin v${{ inputs.release_version }}
    
    - name: Create GitHub Release
      if: ${{ !inputs.dry_run }}
      env:
        GH_TOKEN: ${{ secrets.PUBLISH_GH_TOKEN }}
      run: |
        printf 'Release version %s\n\nMaven Central: https://central.sonatype.com/artifact/io.debezium/mysql-binlog-connector-java/%s\n' \
          "${{ inputs.release_version }}" "${{ inputs.release_version }}" > release-notes.md
        gh release create v${{ inputs.release_version }} \
          --title "Release ${{ inputs.release_version }}" \
          --notes-file release-notes.md
    
    - name: Set next development version
      if: ${{ !inputs.dry_run }}
      run: |
        ./mvnw versions:set -DnewVersion=${{ inputs.next_version }} -DgenerateBackupPoms=false
        git add pom.xml
        git commit -m "Prepare for next development iteration ${{ inputs.next_version }}"
        git push origin ${{ github.ref_name }}
    
    - name: Dry run summary
      if: ${{ inputs.dry_run }}
      run: |
        echo "::notice::Dry run completed successfully"
        echo "::notice::Release version: ${{ inputs.release_version }}"
        echo "::notice::Next version: ${{ inputs.next_version }}"
        echo "::notice::No artifacts were deployed and no tags were created"
